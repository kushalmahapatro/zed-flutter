id = "flutter"
name = "Flutter"
description = "Full Flutter workflow companion for Zed. Install the Dart extension for analyzer/LSP and the Dart debug adapter. This extension adds an enhanced flutter debug locator (profile, flavor, dart-define, attach), FVM SDK hints for the Dart LSP, bootstrap tooling, and example tasks/debug presets."
version = "0.4.2"
snippets = "./snippets/dart.json"
schema_version = 1
authors = ["Kushal"]
repository = "https://github.com/kushalmahapatro/zed-flutter"

# Required for the Wasm debug locator to run `flutter devices --machine`, `fvm flutter …`,
# and shell helpers for `.zed/flutter_device_id`. User installs can still restrict via
# `granted_extension_capabilities` in Zed settings.
[[capabilities]]
kind = "process:exec"
command = "dart"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "melos"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "flutter"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "fvm"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "sh"
args = ["-c", "**"]

[[capabilities]]
kind = "process:exec"
command = "powershell"
args = ["-NoProfile", "-NonInteractive", "-Command", "**"]

[debug_locators.flutter]
